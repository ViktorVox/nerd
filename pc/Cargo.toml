[package]
name = "nerd-pc"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "Nerd"
path = "src/main.rs"

[dependencies]
jpeg-encoder = "0.6"

[build-dependencies]
winresource = "0.1"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
